name: Test and replay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Replay baseline
        run: evaldeck run examples/cases.jsonl --replay examples/baseline.jsonl --out reports/baseline
      - name: Assert candidate regression gate
        shell: bash
        run: |
          set +e
          evaldeck run examples/cases.jsonl --replay examples/candidate.jsonl --baseline reports/baseline/report.json --out reports/candidate
          result=$?
          set -e
          test "$result" -eq 3
